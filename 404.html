<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080b1e">
<title>404 · MINIGAME</title>
<link rel="icon" href="/assets/favicon.png">
<link rel="stylesheet" href="/css/style.css">
<style>
  .nf {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    min-height: 100vh;
    min-height: 100dvh;
    padding: 24px;
    text-align: center;
  }

  .nf-code {
    margin: 0;
    font-size: 64px;
    font-weight: 800;
    letter-spacing: -0.03em;
    color: #f4f7ff;
  }

  .nf-text {
    margin: 0;
    font-size: 14px;
    line-height: 1.7;
    color: #a9b4d2;
  }

  .nf-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 46px;
    margin-top: 10px;
    padding: 0 22px;
    font-size: 14px;
    font-weight: 650;
    color: #fff;
    text-decoration: none;
    background: var(--primary);
    border-radius: 12px;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }

  .nf-btn:active {
    opacity: 0.88;
  }
</style>
</head>
<body>

  <main class="nf">
    <p class="nf-code">404</p>
    <p class="nf-text">这一页被三体人带走了</p>
    <a class="nf-btn" href="/">回首页</a>
  </main>

  <script src="/js/starfield.js"></script>

</body>
</html>
